[package]
name = "draft-canvas"
# Placeholder on purpose: tauri.conf.json points `version` at ../package.json, which is the one real version.
version = "0.0.0"
description = "Draft Canvas Desktop"
edition = "2021"
# The highest `rust-version` among the locked dependencies (darling, icu_*), so an older toolchain
# fails up front with a clear message rather than deep in a dependency. CI builds with stable.
rust-version = "1.88"
license = "Apache-2.0"
publish = false

# The app and the MCP sidecar an agent launches (`mcp/`) build together and share one lockfile and
# target folder, so the sidecar sits beside the app's own binary in development as it does installed.
[workspace]
members = ["mcp"]

[lib]
name = "draft_canvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-dialog = "2.7"
tauri-plugin-window-state = "2.4"
tauri-plugin-opener = "2.5"
# The official updater, driven from Rust only (`src/updater/`); the page gets no updater permission.
# Releases use raw NSIS .exe updates on Windows; legacy ZIP extraction is unused and pulls in
# vulnerable zip 4.x. macOS .app.tar.gz support does not depend on the optional zip feature.
tauri-plugin-updater = { version = "2.12", default-features = false, features = ["rustls-tls", "system-proxy"] }
semver = "1"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "macros", "rt"] }
# The collaboration relay on the local network (`collab/`): the app's own files over HTTP and one
# WebSocket path, served by hyper directly so header timeouts and the connection cap are ours.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["server", "http1", "tokio", "service"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# axum's own WebSocket library, named only to tell a frame over the limit from a broken socket.
tungstenite = { version = "0.29", default-features = false }
# Binds `::` as IPv6-only beside `0.0.0.0`, on the same port, which std and tokio can't ask for.
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15"
subtle = "2.6.1"
serde = { version = "1", features = ["derive"] }
# `raw_value` keeps the servers Draft Canvas leaves alone in Junie's mcp.json exactly as written (`agent/clients.rs`).
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.23"
dunce = "1"
ts-rs = "12"
notify = "8"
# Edits Codex's config.toml keeping its comments and order (`agent/clients.rs`).
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

# Same major versions Tauri already resolves, for the "edited" dot and proxy icon on the window, and
# the tray panel's rounded corners.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
# Whether the folder holding the app can be written to before an update tries (`updater/backend.rs`).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Tauri's own menu library: used only to check that every shortcut string in menu.rs actually parses.
# Tauri drops an unparseable shortcut without a word.
muda = { version = "0.20", default-features = false }
proptest = "1"
# A real WebSocket client for the relay's tests (the version axum's `ws` already uses).
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
