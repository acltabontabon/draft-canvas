server {
    # The unprivileged image runs nginx as a non-root user, which rules out port 80 — see Dockerfile.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    # Newer nginx serves .js as text/javascript, older as application/javascript: both, or bundles
    # can quietly ship uncompressed.
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # The same policy the page carries in its <meta> (vite.config.ts), as a header — a header is
    # applied before any byte of the page is parsed and cannot be edited out of the HTML; plus the
    # two directives a <meta> cannot carry: `frame-ancestors 'none'` (nothing frames this app; the
    # VS Code extension that once did is retired) and the browser features the app never uses.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'";

    # Draft Canvas is a single page with no client-side routes, so unknown paths
    # are a plain 404. Falling back to index.html would do harm here: the build
    # uses relative asset URLs, so index.html served at /a/b would ask for
    # /a/assets/*.js and get HTML back.
    #
    # index.html, sw.js and the Workbox runtime keep stable names, so they're
    # always revalidated (cheaply, by ETag). A stale index.html can never keep
    # pointing at assets from an older build.
    #
    # `add_header` in a location replaces every one set above it, so each location repeats the
    # safety headers.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }

    # Everything under /assets/ has a content hash in its filename.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    }
}
