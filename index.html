<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>Draft Canvas</title>
    <meta
      name="description"
      content="A local-first canvas for developers to explain software visually. Your diagrams stay on your device."
    />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph / Twitter share preview. The favicon is inline, but a crawler
         fetches og:image itself over the network, not the page — this doesn't
         touch the no-network-requests promise the app makes for the browser. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://acltabontabon.com/draft-canvas/" />
    <meta property="og:site_name" content="Draft Canvas" />
    <meta property="og:title" content="Draft Canvas" />
    <meta property="og:description" content="For meetings that suddenly need a diagram." />
    <meta property="og:image" content="https://acltabontabon.com/draft-canvas/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Draft Canvas — a local-first canvas for developers to explain software visually."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Draft Canvas" />
    <meta name="twitter:description" content="For meetings that suddenly need a diagram." />
    <meta name="twitter:image" content="https://acltabontabon.com/draft-canvas/og-image.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314161a'/%3E%3Crect x='6' y='8' width='11' height='7' rx='2' fill='none' stroke='%235fd6c9' stroke-width='2'/%3E%3Crect x='15' y='18' width='11' height='7' rx='2' fill='none' stroke='%236b7280' stroke-width='2'/%3E%3Cpath d='M11.5 15.5v3.5h4' fill='none' stroke='%235fd6c9' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
