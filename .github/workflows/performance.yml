name: Performance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  schedule:
    - cron: '43 2 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    # Keep the OS and architecture stable for timing gates. The x64 hosted pool rotated between
    # EPYC generations, moving selection p95 from 50 to 67 ms with unchanged selection code.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .automation
          sparse-checkout: benchmark
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the selected source against current performance budgets
        run: |
          npm run build
          npm run perf:interaction -- --skip-build --sizes medium --scenarios pan-drag,drag-single,select-clicks --iterations 3
          npm run perf:lifecycle -- --skip-build --sizes medium --only load,export
          npx --no-install tsx .automation/benchmark/gate-cli.ts
      - name: Long-session and larger-workload measurements
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm run perf:interaction -- --skip-build --sizes large,stress --out benchmark/results/interaction-stress.json
          npm run perf:lifecycle -- --skip-build --sizes medium,large,stress --out benchmark/results/lifecycle-soak.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark/results/*.json
          retention-days: 14
