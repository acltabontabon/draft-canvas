name: Deploy the web

# Publishes one verified artifact (scripts/assemble-web.mjs) to two hosts:
#
#   Cloudflare    https://draftcanvas.dev/         the landing page and docs (dist-web/site)
#                 https://app.draftcanvas.dev/     the editor (dist-web/app — the same dist/ as always)
#                 https://www.draftcanvas.dev/     a redirect to the apex
#                 wss://relay.draftcanvas.dev/     the live-collaboration relay (www/cloudflare/relay.js)
#   GitHub Pages  https://acltabontabon.com/draft-canvas/   the old front door (dist-web/legacy): a
#                 moved-house page, old links forwarded, and the editor kept at /editor/ so diagrams
#                 saved at that origin can be handed to the new one.
#
# Cloudflare deploys first and Pages only after it succeeds, so the old address never points at a
# new home that is not up yet. Wrangler creates the custom domains' DNS records itself; it needs the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see docs/reference/website.md).
#
# The old address: acltabontabon.com belongs to the acltabontabon.github.io repository and GitHub
# applies a user site's custom domain to every project site of the same account — so this repository
# needs no CNAME file, and the /draft-canvas/ prefix comes from the repository name. Giving this
# repository a custom domain of its own would make GitHub redirect the old address away, and with it
# the only editor that can still read diagrams saved there.
#
# Releases call this only after verification and desktop acceptance. This is the only workflow that deploys. pages-site.yml calls it rather than building its own
# copy, so there is exactly one definition of what gets published. On a release tag both halves
# come from that tag; anywhere else the landing page comes from the commit and the editor from the
# latest vX.Y.Z (see the first step), so the editor only ever changes on a release. The relay and
# app.draftcanvas.dev are deployed only for a release (or a withdrawal to one): off a release this
# publishes the landing page and the www. redirect alone.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Optional last-good editor tag for withdrawal; run the current workflow from main.
        type: string
        default: ''
  workflow_call:
    inputs:
      artifact-name:
        description: Same-run artifact supplied only by the verified release orchestrator.
        type: string
        default: ''
      verified-commit:
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: inputs.artifact-name == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      editor-revision: ${{ steps.source.outputs.editor-revision }}
      relay-released: ${{ steps.release.outputs.relay-released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # The editor half is only ever a release. A site-only push (pages-site.yml) or a run on demand
      # from a branch would otherwise build main's unreleased editor into /draft-canvas/editor/
      # and stamp the site's download links with a package.json version that has no installers yet.
      # So off a tag, check out the newest stable vX.Y.Z and lay this commit's www/ (and the script that assembles it) over it.
      - name: Build the editor from the latest release
        id: release
        if: github.ref_type != 'tag' || inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          site="$(git rev-parse HEAD)"
          if [ -n "$RELEASE_TAG" ]; then
            echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$' || exit 1
            tag="$RELEASE_TAG"
          else
            # A tag may still be waiting on acceptance, or belong to a failed draft release.
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
            echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || exit 1
          fi
          if [ -z "$tag" ]; then
            echo "::error::No vX.Y.Z release tag to build the editor from."
            exit 1
          fi
          revision="$(SOURCE_REF="refs/tags/$tag" node scripts/verify-source.mjs)"
          git checkout --quiet --detach "$revision"
          git rm -rq --cached --ignore-unmatch www
          rm -rf www
          git checkout "$site" -- www scripts/assemble-web.mjs
          # The relay and the editor's hosting (its config and headers) belong with the editor: the
          # relay is half of the protocol the released editor speaks. From the release too, wherever it
          # has them — so the tests that run below match, and a withdrawal puts back that release's
          # relay. The deploy step only deploys them for a release or a withdrawal.
          relay_released=true
          for file in relay.js relay-room.js relay-room.d.ts relay.jsonc app.jsonc app.headers; do
            if git cat-file -e "$revision:www/cloudflare/$file" 2>/dev/null; then
              git checkout "$revision" -- "www/cloudflare/$file"
            elif [[ "$file" == relay* ]]; then
              relay_released=false
            else
              echo "::notice::$tag has no www/cloudflare/$file; keeping main's $file for app hosting."
            fi
          done
          echo "relay-released=$relay_released" >> "$GITHUB_OUTPUT"
          echo "::notice::Editor from $tag, landing page from ${site:0:7}."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      # A published editor's lockfile can predate a security fix in a build or test tool. Refresh
      # these compatible development dependencies (source-map-js for the build, DOMPurify for
      # Mermaid in tests; neither is bundled) without changing the editor's released source; the
      # complete audit and artifact acceptance below still apply to the resulting build.
      - name: Patch the released editor's development dependencies
        if: github.ref_type != 'tag' || inputs.release-tag != ''
        run: npm update source-map-js dompurify --package-lock-only --ignore-scripts
      - run: npm ci --no-audit --no-fund
      # The site has its own lockfile and shares no dependency with the app on purpose.
      - run: npm ci --no-audit --no-fund
        working-directory: www
      # Builds the editor, builds the site, and assembles dist-web/ — failing loudly if either
      # half is missing a file the deploy needs.
      - run: npm run build:web
      - run: npm run test:coverage
      - run: npm run licenses:check
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: www
      # The deploy's own tooling (Wrangler), pinned by its lockfile.
      - run: npm audit --audit-level=high
        working-directory: www/cloudflare
      - name: Record the assembled source
        id: source
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('fs'), cp = require('child_process'), crypto = require('crypto');
          const lock = fs.readFileSync('package-lock.json');
          fs.writeFileSync('verified-source.json', JSON.stringify({
            commit: process.env.WORKFLOW_COMMIT,
            editorCommit: cp.execSync('git rev-parse HEAD').toString().trim(),
            siteCommit: process.env.WORKFLOW_COMMIT,
            editorBuildLockSha256: crypto.createHash('sha256').update(lock).digest('hex'),
            sourceMapBuildVersion: JSON.parse(lock).packages['node_modules/source-map-js']?.version,
          }));
          NODE
          echo "editor-revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar -cf verified-web.tar dist dist-web verified-source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-site-${{ github.run_id }}
          path: verified-web.tar
          if-no-files-found: error

  acceptance:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      DC_TEST_BUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.editor-revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      # Test the selected editor's journeys, with the current no-rebuild server configuration.
      - name: Use the artifact-only server configuration
        env:
          CONTROL_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CONTROL_COMMIT"
          git checkout FETCH_HEAD -- playwright.dist.config.ts playwright.web.config.ts e2e/web-deploy.spec.ts scripts/stage-subpath.mjs scripts/serve-web.mjs
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-site-${{ github.run_id }}
      - run: tar -xf verified-web.tar
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run e2e:offline -- --fail-on-flaky-tests
      - run: npm run e2e:web -- --fail-on-flaky-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: site-acceptance-${{ matrix.browser }}
          path: |
            playwright-report-offline/
            playwright-report-web/

  cloudflare:
    needs: [build, acceptance]
    # A release caller already completed CI. Site-only builds must pass every browser shard.
    if: ${{ !cancelled() && (inputs.artifact-name != '' || (needs.build.result == 'success' && needs.acceptance.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare
      url: https://draftcanvas.dev/
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact-name || format('verified-site-{0}', github.run_id) }}
      - run: tar -xf verified-web.tar
      - name: The artifact belongs to the verified source
        env:
          EXPECTED_COMMIT: ${{ inputs.verified-commit || github.sha }}
        run: node -e 'const source=require("./verified-source.json"); if(source.commit !== process.env.EXPECTED_COMMIT) throw new Error("Artifact source does not match verification")'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
      # The relay first, so a new editor never points at a relay that is not there yet; then the
      # editor, so the site never links to an editor that is not there yet; the www. redirect last.
      # Each config names its custom domain, and Wrangler creates its DNS record. The relay's config
      # also carries its Durable Object migration, which Wrangler applies on the same deploy.
      # Wrangler comes from the verified artifact's own lockfile (www/cloudflare/package-lock.json),
      # integrity-checked, never fetched by name; `--no-install` refuses anything not installed.
      - name: Install the pinned Wrangler
        working-directory: dist-web/cloudflare
        run: npm ci --no-audit --no-fund
      # The relay and app.draftcanvas.dev change only with a release (or a withdrawal to one). A
      # site-only push deploys the landing page and the www. redirect, and leaves both as the last
      # release put them — even when the push touched www/cloudflare/.
      - name: Deploy relay.draftcanvas.dev, app.draftcanvas.dev, draftcanvas.dev and www.
        working-directory: dist-web/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE: ${{ inputs.artifact-name != '' || github.ref_type == 'tag' || inputs.release-tag != '' }}
          RELAY_RELEASED: ${{ needs.build.outputs.relay-released }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          configs="site www"
          if [ "$RELEASE" = "true" ]; then
            configs="app site www"
            if [ "$RELAY_RELEASED" != "false" ]; then
              configs="relay $configs"
            else
              echo "::notice::$RELEASE_TAG has no relay; the live relay was left as is."
            fi
          else
            echo "::notice::Site-only deploy: the relay and app.draftcanvas.dev stay as the last release left them."
          fi
          for config in $configs; do
            npx --no-install wrangler deploy --config "$config.jsonc"
          done

  deploy:
    needs: [build, acceptance, cloudflare]
    # Only once the new home is up: this replaces the old address with the moved-house page.
    if: ${{ !cancelled() && needs.cloudflare.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact-name || format('verified-site-{0}', github.run_id) }}
      - run: tar -xf verified-web.tar
      - name: The artifact belongs to the verified source
        env:
          EXPECTED_COMMIT: ${{ inputs.verified-commit || github.sha }}
        run: node -e 'const source=require("./verified-source.json"); if(source.commit !== process.env.EXPECTED_COMMIT) throw new Error("Artifact source does not match verification")'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-web/legacy/
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
