name: Docker

# Packages an already-released version as the official image on Docker Hub.
#
# It isn't triggered by `release: published`: release.yml creates the GitHub
# Release with GITHUB_TOKEN, and events caused by that token never start other
# workflows. So release.yml calls this once the Release exists. It can also be
# run by hand to republish an existing tag. Republishing an older *stable* tag
# moves `latest` back to it.
#
# Needs the DOCKERHUB_USERNAME repository variable and the DOCKERHUB_TOKEN
# repository secret (a Docker Hub access token, not the account password).
#
# It deliberately does NOT sync the Docker Hub page's description. That was
# tried: an access token authenticates, and Docker Hub then answers the
# metadata PATCH with 403, because editing a repository's description is one
# of the things a token may not do however it is scoped. Only the account
# password reaches that endpoint, and a password in CI is a worse trade than
# a page updated by hand. The description is maintained on Docker Hub itself;
# CONTRIBUTING.md's release workflow says so.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.2.3
        required: true
        type: string
      verified-commit:
        description: Commit already verified by the release orchestrator.
        type: string
        default: ''
    secrets:
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)publish, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verification:
    if: inputs.verified-commit == ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag }}

  build:
    needs: verification
    if: ${{ !cancelled() && (inputs.verified-commit != '' || needs.verification.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.verified-commit || needs.verification.outputs.commit }}
          persist-credentials: false
      - name: The source version matches the publication tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw new Error("Publication tag does not match the verified source version")'
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          # Verification checks out a commit, so HEAD has no ref to infer. Tags come from the
          # explicit release input; revision must name that source, even on a manual main run.
          context: workflow
          images: acltabontabon/draft-canvas
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.title=Draft Canvas
            org.opencontainers.image.description=A local-first canvas for developers to explain software visually.
            org.opencontainers.image.source=https://github.com/acltabontabon/draft-canvas
            org.opencontainers.image.url=https://github.com/acltabontabon/draft-canvas
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ inputs.verified-commit || needs.verification.outputs.commit }}
          annotations: |
            org.opencontainers.image.title=Draft Canvas
            org.opencontainers.image.description=A local-first canvas for developers to explain software visually.
            org.opencontainers.image.source=https://github.com/acltabontabon/draft-canvas
            org.opencontainers.image.url=https://github.com/acltabontabon/draft-canvas
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ inputs.verified-commit || needs.verification.outputs.commit }}
      # An OCI archive preserves both platforms and their SBOM/provenance manifests. Publication
      # copies this archive, rather than rebuilding after the runtime tests.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/draft-canvas.oci.tar
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Both archived platforms serve the app
        env:
          ARCHIVE: ${{ runner.temp }}/draft-canvas.oci.tar
        run: |
          for arch in amd64 arm64; do
            skopeo copy --override-os linux --override-arch "$arch" "oci-archive:$ARCHIVE" "docker-daemon:draft-canvas:verified-$arch"
            docker run --detach --platform "linux/$arch" --name draft-canvas --publish 8080:8080 "draft-canvas:verified-$arch"
            for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
            curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
            test "$(docker exec draft-canvas id -u)" != 0
            curl -fsSI http://127.0.0.1:8080/ | grep -qi "content-security-policy: .*frame-ancestors 'none'"
            curl -fsSI http://127.0.0.1:8080/ | grep -qi 'x-frame-options: DENY'
            curl -fsS http://127.0.0.1:8080/THIRD_PARTY_LICENSES.txt | grep -q react
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope/deeper)" = 404
            docker rm --force draft-canvas
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-docker-${{ github.run_id }}
          path: ${{ runner.temp }}/draft-canvas.oci.tar
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    # A release caller skips verification because it already supplied a verified commit. An
    # explicit condition keeps that skipped ancestor from suppressing promotion of the tested image.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-docker-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-docker
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote the tested archive without rebuilding
        env:
          TAGS: ${{ needs.build.outputs.tags }}
          ARCHIVE: ${{ runner.temp }}/verified-docker/draft-canvas.oci.tar
        run: |
          test -n "$TAGS"
          while IFS= read -r tag; do
            skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" "oci-archive:$ARCHIVE" "docker://$tag"
          done <<< "$TAGS"
