name: Desktop checks

# Called by CI for desktop-affecting changes and by standalone desktop releases.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      shared-checks:
        description: Run shared verification unless the CI caller already supplies it.
        type: boolean
        default: true
      web-artifact-name:
        description: Same-run verified web build; standalone callers build their own.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        env:
          SOURCE_REF: ${{ inputs.ref }}
          WORKFLOW_REVISION: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          revision="$(node scripts/verify-source.mjs)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  shared:
    needs: source
    if: inputs.shared-checks
    uses: ./.github/workflows/shared-checks.yml
    with:
      ref: ${{ needs.source.outputs.revision }}

  # Everything that needs no window: the frontend the desktop app bundles, and that it is the
  # only place Tauri appears.
  frontend:
    needs: source
    runs-on: ubuntu-latest
    # The tests take about five minutes; the rest is headroom for installing two browsers' system
    # libraries. When the runner's Ubuntu mirror stalls, apt falls back to archive.ubuntu.com one
    # package at a time — 15 minutes on 2026-10-01, which cut the WebKit run off at the old 20.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run desktop:web
      - run: node scripts/check-desktop-version.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.web-artifact-name != ''
        with:
          name: ${{ inputs.web-artifact-name }}
      - if: inputs.web-artifact-name != ''
        run: tar -xf verified-web.tar
      - if: inputs.web-artifact-name == ''
        run: npm run build
      # The web build must carry no desktop code at all: it is what everyone else runs.
      - name: The web bundle holds no desktop code
        run: |
          if grep -rlE "__TAURI|@tauri-apps|host_ready|DesktopController" dist/assets/*.js; then
            echo "::error::The web bundle contains desktop code."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium webkit
      # Chromium and WebKit: the engines the desktop shell actually embeds (WebView2, WebKitGTK/WKWebView).
      - run: PLAYWRIGHT_BROWSER=chromium npm run e2e:desktop -- --fail-on-flaky-tests
      - run: PLAYWRIGHT_BROWSER=webkit npm run e2e:desktop -- --fail-on-flaky-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-desktop
          path: playwright-report-desktop/
          retention-days: 7

  # The Rust side, and a real build of the app on both first-release platforms: compile, package
  # (a .dmg on macOS, an NSIS installer on Windows) and launch the result.
  rust:
    needs: source
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, binary: src-tauri/target/debug/draft-canvas }
          - { name: Windows x64, os: windows-latest, binary: src-tauri/target/debug/draft-canvas.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      # The app bundles this build; the Rust side won't compile without it.
      - run: npm run desktop:web
      # The workspace: the app and its agent connector (src-tauri/mcp), whose tests drive the real
      # connector binary with a real MCP client.
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
      - name: Install browsers for the real MCP-to-editor round trip
        if: runner.os == 'macOS'
        run: npx playwright install chromium webkit
      - name: Real MCP sidecar to proposal review and acceptance
        if: runner.os == 'macOS'
        run: npm run e2e:mcp -- --project=chromium --project=webkit --fail-on-flaky-tests
      - name: Build and package
        run: npx tauri build --debug --ci --config src-tauri/tauri.sidecar.conf.json
      # Bundled beside the app, and the same version as it: Settings → AI agents points agents here.
      - name: The agent connector is bundled and answers
        shell: bash
        run: |
          exe=""; [[ "$RUNNER_OS" == "Windows" ]] && exe=".exe"
          version="$(node -p 'require("./package.json").version')"
          output="$(src-tauri/target/debug/draft-canvas-mcp$exe --version)"
          echo "$output"
          [[ "$output" == "draft-canvas-mcp $version" ]] || { echo "::error::Expected draft-canvas-mcp $version"; exit 1; }
      - name: The packaged app starts
        shell: bash
        env:
          DRAFT_CANVAS_SMOKE: '1'
        run: |
          output="$(${{ matrix.binary }})"
          echo "$output"
          echo "$output" | grep -q DRAFT_CANVAS_SMOKE_OK

  verify:
    needs: [source, shared, frontend, rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require desktop and applicable shared checks
        env:
          SHARED: ${{ inputs.shared-checks }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          const shared = process.env.SHARED;
          if (shared !== 'true' && shared !== 'false') throw new Error('Missing shared verification scope');
          for (const [job, { result }] of Object.entries(results)) {
            const expected = job === 'shared' && shared === 'false' ? 'skipped' : 'success';
            if (result !== expected) throw new Error(`${job}: expected ${expected}, got ${result}`);
          }
          NODE
