name: Shared checks

# One definition for ordinary CI and standalone desktop release verification.
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      # Keep the site's dependencies available to the same unit suite as before.
      - run: npm ci
        timeout-minutes: 5
        working-directory: www
      - run: npm run lint
      - run: npm run typecheck:tooling
      # Unit tests with the existing coverage floor (vite.config.ts).
      - run: npm run test:coverage

