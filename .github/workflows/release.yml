name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Pulls the section of CHANGELOG.md whose heading matches this tag's
      # version (e.g. tag v0.2.0 -> "## [0.2.0]") and uses it as the release
      # body, so the changelog is the single source of truth for release
      # notes instead of writing them twice.
      - name: Extract changelog section for this tag
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section found for [$VERSION] — falling back to GitHub's auto-generated notes." >&2
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.found == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.found != 'true' }}
          # v1.3.0-rc.1 and friends are marked as prereleases on GitHub too.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publishes the official Docker Hub image once the Release above exists.
  # Only this job receives the Docker Hub token.
  docker:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
