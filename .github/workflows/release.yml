name: Release

on:
  push:
    tags:
      # Web app releases only: vX.Y.Z and prereleases like vX.Y.Z-rc.1. The VS Code extension
      # releases from extension-vX.Y.Z tags in vscode-release.yml.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Pulls the section of CHANGELOG.md whose heading matches this tag's
      # version (e.g. tag v0.2.0 -> "## [0.2.0]") and uses it as the release
      # body, so the changelog is the single source of truth for release
      # notes instead of writing them twice. The demo gif leads the body,
      # pinned to this tag's copy of docs/media so it can't drift from what
      # the release actually looks like. (An .mp4 linked by URL doesn't embed
      # as a playable video in a release body — only a gif/png/etc. renders
      # inline — so the gif is what carries the demo here.)
      - name: Extract changelog section for this tag
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MEDIA_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/docs/media"

          {
            echo "![Draft Canvas demo](${MEDIA_BASE}/demo.gif)"
            echo
          } > release-notes.md

          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > changelog-section.md

          # CHANGELOG.md hard-wraps each bullet across lines for readability
          # as a file. A release body isn't rendered as a file, though — it's
          # rendered like a comment, where a single newline is a hard break —
          # so without this, every wrapped line would show up as its own
          # forced line instead of flowing as one sentence. Re-join each
          # bullet's continuation lines before they become the release body.
          python3 -c '
          import re
          with open("changelog-section.md") as f:
              lines = f.read().splitlines()
          out, buf = [], None
          for line in lines:
              if line.strip() == "":
                  if buf is not None:
                      out.append(buf)
                      buf = None
                  out.append("")
              elif line.startswith("#") or line.startswith("- ") or not line.startswith(" "):
                  if buf is not None:
                      out.append(buf)
                  buf = line
              else:
                  buf = line.strip() if buf is None else buf + " " + line.strip()
          if buf is not None:
              out.append(buf)
          with open("changelog-section.md", "w") as f:
              f.write("\n".join(out) + "\n")
          '

          cat changelog-section.md >> release-notes.md

          if [ -s changelog-section.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG.md section found for [$VERSION] — falling back to GitHub's auto-generated notes." >&2
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.changelog.outputs.found != 'true' }}
          # v1.3.0-rc.1 and friends are marked as prereleases on GitHub too.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publishes the official Docker Hub image once the Release above exists.
  # Only this job receives the Docker Hub token.
  docker:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
