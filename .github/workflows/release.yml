name: Release

# A Draft Canvas release: the web app (Pages, from pages.yml on the same tag), the Docker image and the
# desktop app, one version and one GitHub release. The VS Code extension releases from extension-vX.Y.Z
# tags in vscode-release.yml; a desktop preview (desktop-vX.Y.Z-alpha.N) from desktop-release.yml.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      # The body is this tag's section of CHANGELOG.md — the one source of truth for what changed — led
      # by the demo and the ways to get it, and followed by how to open the desktop installers the first
      # time (scripts/release-notes.mjs). Without a section, GitHub's own notes stand in.
      - name: Write the release notes
        id: changelog
        run: |
          echo "title=Draft Canvas ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "![Draft Canvas demo](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/docs/media/demo.gif)" > release-notes.md
          fi

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.changelog.outputs.title }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.changelog.outputs.found != 'true' }}
          # v1.3.0-rc.1 and friends are marked as prereleases on GitHub too.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Publishes the official Docker Hub image once the Release above exists.
  # Only this job receives the Docker Hub token.
  docker:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Builds the desktop installers and signed update packages into the Release above, then tells
  # installed copies about it. Only this job receives the update signing key.
  desktop:
    needs: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
