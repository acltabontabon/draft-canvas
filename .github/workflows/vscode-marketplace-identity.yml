name: VS Code Marketplace identity

# One-time setup helper (vscode-extension/RELEASING.md): signs in as the publishing identity and
# prints the Azure DevOps profile ID the Marketplace publisher's Members page needs. Signing in also
# creates that profile, which a new identity doesn't have yet. It prints an ID, never a token.

on: workflow_dispatch

permissions:
  contents: read
  id-token: write

jobs:
  profile:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Azure DevOps profile ID
        # 499b84ac-… is Azure DevOps' application ID in Microsoft Entra, the same for everyone.
        run: |
          ID="$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          echo "Add this ID as a Contributor on the acltabontabon publisher: $ID"
          echo "### Marketplace member ID: \`$ID\`" >> "$GITHUB_STEP_SUMMARY"
