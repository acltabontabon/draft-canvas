name: VS Code Marketplace identity

# One-time setup helper (vscode-extension/RELEASING.md): signs in as the publishing identity and prints
# the Azure DevOps profile ID that the Marketplace publisher's Members page needs. Signing in also
# creates that profile, which a new identity doesn't have yet. It prints an ID, never a token, and it
# publishes nothing. Run it from main.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The publishing identity is configured
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          GUID='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if ! [[ "$CLIENT_ID" =~ $GUID && "$TENANT_ID" =~ $GUID ]]; then
            echo "::error::The vscode-marketplace environment needs AZURE_CLIENT_ID and AZURE_TENANT_ID variables holding the Entra app's IDs."
            exit 1
          fi

      - name: Sign in to Microsoft Entra ID
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Azure DevOps profile ID
        # 499b84ac-… is Azure DevOps' application ID in Microsoft Entra, the same for everyone.
        run: |
          ID="$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)"
          echo "Add this ID as a Contributor on the acltabontabon publisher: $ID"
          echo "### Marketplace member ID: \`$ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Add it at https://marketplace.visualstudio.com/manage/publishers/acltabontabon → Members, with the Contributor role." >> "$GITHUB_STEP_SUMMARY"
