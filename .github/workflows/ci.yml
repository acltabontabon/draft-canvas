name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref to verify; alternate revisions must belong to default branch history.
        type: string
        default: ''
    outputs:
      artifact-name:
        value: ${{ jobs.verify.outputs.artifact-name }}
      commit:
        value: ${{ jobs.source.outputs.revision }}

permissions:
  contents: read

# A new push to a pull request supersedes the run before it. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        # Run the verifier from this workflow's checkout, never from the selected source.
        env:
          SOURCE_REF: ${{ inputs.ref }}
          WORKFLOW_REVISION: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          revision="$(node scripts/verify-source.mjs)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  verify:
    needs: source
    runs-on: ubuntu-latest
    outputs:
      artifact-name: verified-web-${{ github.run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      # The site is a separate project with its own lockfile; a break in it should fail here, not
      # at deploy time.
      - run: npm ci
        working-directory: www
      - name: Validate workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - run: npm run lint
      - run: npm run typecheck:tooling
      # Builds the editor, the site, and the assembled dist-web/ the deploy publishes.
      - run: npm run build:web
      # Unit tests with the coverage floor (vite.config.ts): a drop below it fails the build.
      - run: npm run test:coverage
      - run: npm run licenses:check
      - name: Record the source and preserve the built artifact
        env:
          VERIFIED_COMMIT: ${{ needs.source.outputs.revision }}
        run: |
          node -e 'require("fs").writeFileSync("verified-source.json", JSON.stringify({ commit: process.env.VERIFIED_COMMIT }))'
          tar -cf verified-web.tar dist dist-web verified-source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-web-${{ github.run_id }}
          path: verified-web.tar
          if-no-files-found: error
          retention-days: 7

  # The whole journey suite, split by file across three runners per engine. Keep one worker per
  # runner: parallel browsers on one CPU compete for frames and make interaction tests less stable.
  # Retries stay on so a flaky test is *identified*: `--fail-on-flaky-tests` fails when a test only
  # passed on its retry, so a flake is fixed, not tolerated.
  e2e:
    needs: [source, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      DC_TEST_BUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - name: Use the artifact-only server configuration
        env:
          CONTROL_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$CONTROL_COMMIT"
          git checkout FETCH_HEAD -- playwright.dist.config.ts playwright.web.config.ts
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
      - run: tar -xf verified-web.tar
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - id: journeys
        run: npm run e2e -- --shard=${{ matrix.shard }}/3 --fail-on-flaky-tests
      # These small artifact suites run once per engine, not once per journey shard. They consume
      # the verified build above; neither needs the site's dependencies or a rebuild.
      - if: ${{ !cancelled() && steps.journeys.outcome != 'skipped' && matrix.shard == 1 && matrix.browser == 'chromium' }}
        run: npm run e2e:offline -- --fail-on-flaky-tests
      - if: ${{ !cancelled() && steps.journeys.outcome != 'skipped' && matrix.shard == 1 }}
        run: npm run e2e:web -- --fail-on-flaky-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            playwright-report-offline/
            playwright-report-web/
          retention-days: 7

  security:
    needs: source
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.source.outputs.revision }}

  performance:
    needs: source
    uses: ./.github/workflows/performance.yml
    with:
      ref: ${{ needs.source.outputs.revision }}
