name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Source ref to verify; alternate revisions must belong to default branch history.
        type: string
        default: ''
      full-checks:
        description: Reusable callers always verify the complete source, regardless of changed paths.
        type: boolean
        default: true
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
      commit:
        value: ${{ jobs.source.outputs.revision }}

permissions:
  contents: read

# A new push to a pull request supersedes the run before it. Runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      full: ${{ steps.plan.outputs.full }}
      reused: ${{ steps.reuse.outputs.reused }}
      performance: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
      playwright-image: ${{ steps.plan.outputs.playwright-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: source
        # Run the verifier from this workflow's checkout, never from the selected source.
        env:
          SOURCE_REF: ${{ inputs.ref }}
          WORKFLOW_REVISION: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          revision="$(node scripts/verify-source.mjs)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - id: plan
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || inputs.full-checks == true || inputs.ref != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci-plan.mjs

      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          CI_FULL: ${{ steps.plan.outputs.full }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' || inputs.full-checks == true || inputs.ref != '' }}
        run: node scripts/ci-reuse.mjs lookup ci.yml

      # Record source before checks; it is reusable only after the entire PR run succeeds.
      - name: Record the tested PR source
        if: github.event_name == 'pull_request' && inputs.ref == ''
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          CI_FULL: ${{ steps.plan.outputs.full }}
        run: node scripts/ci-reuse.mjs record ci.yml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'pull_request' && inputs.ref == ''
        with:
          name: ci-evidence-ci.yml-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence.json
          if-no-files-found: error
          retention-days: 7

  workflows:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  # Only build-related checks sit on the browser suite's critical path. Coverage runs alongside it.
  build:
    needs: source
    if: needs.source.outputs.full == 'true' && needs.source.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: verified-web-${{ github.run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      # The site is a separate project with its own lockfile; a break in it should fail here, not
      # at deploy time.
      - run: npm ci
        timeout-minutes: 5
        working-directory: www
      - run: npm run lint
      - run: npm run typecheck:tooling
      # Builds the editor, the site, and the assembled dist-web/ the deploy publishes.
      - run: npm run build:web
      - run: npm run licenses:check
      - name: Record the source and preserve the built artifact
        env:
          VERIFIED_COMMIT: ${{ needs.source.outputs.revision }}
        run: |
          node -e 'require("fs").writeFileSync("verified-source.json", JSON.stringify({ commit: process.env.VERIFIED_COMMIT }))'
          tar -cf verified-web.tar dist dist-web verified-source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-web-${{ github.run_id }}
          path: verified-web.tar
          if-no-files-found: error
          retention-days: 7

  coverage:
    needs: source
    if: needs.source.outputs.full == 'true' && needs.source.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      # Keep the site's dependencies available to the same unit suite as before.
      - run: npm ci
        timeout-minutes: 5
        working-directory: www
      # Unit tests with the existing coverage floor (vite.config.ts).
      - run: npm run test:coverage

  docs:
    needs: source
    if: needs.source.outputs.full == 'false' && needs.source.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npx vitest run tests/docs.test.ts
      - run: npm ci
        timeout-minutes: 5
        working-directory: www
      # Published guides are part of the site; validate rendering without rebuilding the editor.
      - run: npm run site:build

  # The whole journey suite, split by file across three runners per engine. Keep one worker per
  # runner: parallel browsers on one CPU compete for frames and make interaction tests less stable.
  # Retries stay on so a flaky test is *identified*: `--fail-on-flaky-tests` fails when a test only
  # passed on its retry, so a flake is fixed, not tolerated.
  e2e:
    needs: [source, build]
    if: needs.source.outputs.full == 'true' && needs.source.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.source.outputs.playwright-image }}
      # Match GitHub's mounted home/workspace owner; Firefox rejects a root process with this home.
      options: --user 1001 --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      DC_TEST_BUILT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - name: Use the artifact-only server configuration
        env:
          CONTROL_COMMIT: ${{ github.sha }}
        run: |
          # Container steps use a different Git HOME from checkout's temporary safe-directory config.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --no-tags --depth=1 origin "$CONTROL_COMMIT"
          git checkout FETCH_HEAD -- playwright.dist.config.ts playwright.web.config.ts
      - run: npm ci
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
      - run: tar -xf verified-web.tar
      - id: journeys
        timeout-minutes: 15
        run: npm run e2e -- --shard=${{ matrix.shard }}/3 --fail-on-flaky-tests
      # These small artifact suites run once per engine, not once per journey shard. They consume
      # the verified build above; neither needs the site's dependencies or a rebuild.
      - if: ${{ !cancelled() && steps.journeys.outcome != 'skipped' && matrix.shard == 1 && matrix.browser == 'chromium' }}
        timeout-minutes: 3
        run: npm run e2e:offline -- --fail-on-flaky-tests
      - if: ${{ !cancelled() && steps.journeys.outcome != 'skipped' && matrix.shard == 1 }}
        timeout-minutes: 3
        run: npm run e2e:web -- --fail-on-flaky-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            playwright-report-offline/
            playwright-report-web/
          retention-days: 7

  security:
    needs: source
    if: needs.source.outputs.full == 'true'
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.source.outputs.revision }}

  performance:
    needs: source
    # Timing budgets gate tagged releases; ordinary PR/main CI verifies correctness.
    if: needs.source.outputs.performance == 'true' && needs.source.outputs.full == 'true' && needs.source.outputs.reused != 'true'
    uses: ./.github/workflows/performance.yml
    with:
      ref: ${{ needs.source.outputs.revision }}

  # Keep the existing verify check as the final gate, including coverage and every browser shard.
  verify:
    needs: [source, workflows, build, coverage, docs, e2e, security, performance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable check
        env:
          FULL: ${{ needs.source.outputs.full }}
          REUSED: ${{ needs.source.outputs.reused }}
          PERFORMANCE: ${{ needs.source.outputs.performance }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          const full = process.env.FULL;
          if (full !== 'true' && full !== 'false') throw new Error('Missing CI scope');
          const reused = process.env.REUSED;
          if (reused !== 'true' && reused !== 'false') throw new Error('Missing CI reuse decision');
          const performance = process.env.PERFORMANCE;
          if (performance !== 'true' && performance !== 'false') throw new Error('Missing performance scope');
          if (performance === 'true' && (full !== 'true' || reused !== 'false')) {
            throw new Error('Tagged releases require fresh full verification');
          }
          const required = new Set(['source', 'workflows', ...(full === 'true' ? ['security'] : []),
            ...(performance === 'true' ? ['performance'] : []),
            ...(reused === 'true' ? [] : full === 'true'
              ? ['build', 'coverage', 'e2e'] : ['docs'])]);
          for (const [job, { result }] of Object.entries(results)) {
            const expected = required.has(job) ? 'success' : 'skipped';
            if (result !== expected) throw new Error(`${job}: expected ${expected}, got ${result}`);
          }
          NODE
