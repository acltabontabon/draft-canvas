name: VS Code extension

# Builds, packages, checks and smoke-tests Draft Canvas for VS Code (vscode-extension/). Runs on
# changes to the extension, and is called by vscode-release.yml so a release publishes exactly the
# VSIX tested here. The web app's side of the file workflow (src/host/) is tested by ci.yml.

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension.yml'
  workflow_call:
    outputs:
      vsix:
        description: File name of the packaged VSIX, uploaded as the `vsix` artifact.
        value: ${{ jobs.package.outputs.vsix }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    outputs:
      vsix: ${{ steps.pack.outputs.vsix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      # keytar is vsce's optional credential store for interactive logins; nothing here needs it.
      - run: npm ci --omit=optional
      - run: npm run compile

      - name: Package
        id: pack
        run: |
          VSIX="draft-canvas-$(node -p 'require("./package.json").version').vsix"
          npx vsce package --out "$VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Check the package
        run: node scripts/check-vsix.mjs "${{ steps.pack.outputs.vsix }}"

      - name: Smoke-test the installed package
        run: xvfb-run -a node test/smoke/run.mjs "${{ steps.pack.outputs.vsix }}"

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode-extension/${{ steps.pack.outputs.vsix }}
          if-no-files-found: error
          retention-days: 30
