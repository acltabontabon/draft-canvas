name: VS Code extension release

# Releases Draft Canvas for VS Code, and nothing else, from an `extension-vX.Y.Z` tag. The web app
# releases from `vX.Y.Z` tags (release.yml, pages.yml); neither lane triggers the other. Steps and
# one-time setup: vscode-extension/RELEASING.md.

on:
  push:
    tags:
      - 'extension-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# One Marketplace publication at a time, and never cancel one halfway.
concurrency:
  group: vscode-marketplace-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag, package.json and changelog agree
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#extension-v}"
          PACKAGE_VERSION="$(node -p 'require("./vscode-extension/package.json").version')"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match vscode-extension/package.json version $PACKAGE_VERSION."
            exit 1
          fi
          IDENTITY="$(node -p 'const p = require("./vscode-extension/package.json"); p.publisher + "." + p.name')"
          if [ "$IDENTITY" != "acltabontabon.draft-canvas" ]; then
            echo "::error::vscode-extension/package.json identifies as $IDENTITY, not acltabontabon.draft-canvas."
            exit 1
          fi
          if ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" vscode-extension/CHANGELOG.md; then
            echo "::error::vscode-extension/CHANGELOG.md has no dated '## [$VERSION] - YYYY-MM-DD' section."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The extension edits files through the hosted app's host mode (src/host/). Publishing before
      # the site serves it would ship an editor that can't load.
      - name: The hosted app supports the extension
        run: |
          APP_URL="https://acltabontabon.com/draft-canvas/"
          ENTRY="$(curl -fsSL "$APP_URL" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
          if [ -z "$ENTRY" ] || ! curl -fsSL "$APP_URL$ENTRY" | grep -q 'draft-canvas:load'; then
            echo "::error::$APP_URL doesn't serve the host mode the extension needs yet. Release the web app first."
            exit 1
          fi

  package:
    needs: verify
    uses: ./.github/workflows/vscode-extension.yml

  publish:
    needs: [verify, package]
    runs-on: ubuntu-latest
    # Holds the Entra identity's IDs; add required reviewers here to approve each publication.
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci --omit=optional
        working-directory: vscode-extension
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vscode-extension

      - name: Publishing identity is configured
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID on the vscode-marketplace environment (see vscode-extension/RELEASING.md)."
            exit 1
          fi

      # Short-lived Microsoft Entra token through GitHub's OIDC: no PAT or secret is stored anywhere.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # A version already on the Marketplace is left as it is, so re-running a release that failed
      # after publishing moves on to the GitHub Release instead of failing again.
      - name: Publish to the Marketplace
        working-directory: vscode-extension
        run: npx vsce publish --packagePath "${{ needs.package.outputs.vsix }}" --azure-credential --skip-duplicate

  github-release:
    needs: [verify, package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      - name: Release notes from the extension's changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) { found = 1 }; next }
            found { print }
          ' vscode-extension/CHANGELOG.md > release-notes.md
          # Bullets are hard-wrapped in the file; a release body would show every wrap as a line break.
          python3 -c '
          import re, pathlib
          p = pathlib.Path("release-notes.md")
          p.write_text(re.sub(r"\n(?!\n|- |#) +", " ", p.read_text()))
          '
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: Draft Canvas for VS Code ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: ${{ needs.package.outputs.vsix }}
          # "Latest" stays with the web app's releases (the README's release badge follows it).
          make_latest: false
