name: VS Code extension release

# Releases Draft Canvas for VS Code, and nothing else, from an `extension-vX.Y.Z` tag: checks it,
# packages and smoke-tests the VSIX, and creates its GitHub Release with that VSIX attached. The
# Marketplace upload itself is done by hand (vscode-extension/RELEASING.md), so this workflow holds no
# Marketplace credentials at all. The web app releases from `vX.Y.Z` tags (release.yml, pages.yml);
# neither lane triggers the other.

on:
  push:
    tags:
      - 'extension-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# One extension release at a time, and never cancel one halfway.
concurrency:
  group: vscode-marketplace-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag, package.json and changelog agree
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#extension-v}"
          PACKAGE_VERSION="$(node -p 'require("./vscode-extension/package.json").version')"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match vscode-extension/package.json version $PACKAGE_VERSION."
            exit 1
          fi
          IDENTITY="$(node -p 'const p = require("./vscode-extension/package.json"); p.publisher + "." + p.name')"
          if [ "$IDENTITY" != "acltabontabon.draft-canvas" ]; then
            echo "::error::vscode-extension/package.json identifies as $IDENTITY, not acltabontabon.draft-canvas."
            exit 1
          fi
          if ! grep -Eq "^## \[${VERSION//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" vscode-extension/CHANGELOG.md; then
            echo "::error::vscode-extension/CHANGELOG.md has no dated '## [$VERSION] - YYYY-MM-DD' section."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The extension edits files through the hosted app's host mode (src/host/). Publishing before
      # the site serves it would ship an editor that can't load.
      - name: The hosted app supports the extension
        run: |
          APP_URL="https://acltabontabon.com/draft-canvas/"
          ENTRY="$(curl -fsSL "$APP_URL" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
          if [ -z "$ENTRY" ] || ! curl -fsSL "$APP_URL$ENTRY" | grep -q 'draft-canvas:load'; then
            echo "::error::$APP_URL doesn't serve the host mode the extension needs yet. Release the web app first."
            exit 1
          fi

  package:
    needs: verify
    uses: ./.github/workflows/vscode-extension.yml

  github-release:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vsix

      # A version that's already on the Marketplace is final, so its release carries exactly the package
      # the Marketplace serves. Otherwise it carries the VSIX this run just tested, which is the file to
      # upload.
      - name: Which package to attach
        id: listed
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VSIX: ${{ needs.package.outputs.vsix }}
        run: |
          VERSIONS="$(curl -fsS -X POST https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery \
            -H 'Content-Type: application/json' -H 'Accept: application/json;api-version=7.2-preview.1' \
            -d '{"filters":[{"criteria":[{"filterType":7,"value":"acltabontabon.draft-canvas"}]}],"flags":1}' \
            | jq -r '.results[0].extensions[0].versions[]?.version')"
          if grep -qx "$VERSION" <<< "$VERSIONS"; then
            curl -fsSL --compressed -o "$VSIX" \
              "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/acltabontabon/vsextensions/draft-canvas/$VERSION/vspackage"
            unzip -p "$VSIX" extension/package.json | jq -e --arg v "$VERSION" '.version == $v'
            echo "listed=true" >> "$GITHUB_OUTPUT"
          else
            echo "listed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from the extension's changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]") > 0) { found = 1 }; next }
            found { print }
          ' vscode-extension/CHANGELOG.md > release-notes.md
          # Bullets are hard-wrapped in the file; a release body would show every wrap as a line break.
          python3 -c '
          import re, pathlib
          p = pathlib.Path("release-notes.md")
          p.write_text(re.sub(r"\n(?!\n|- |#) +", " ", p.read_text()))
          '
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        id: release
        with:
          name: Draft Canvas for VS Code ${{ needs.verify.outputs.version }}
          body_path: release-notes.md
          files: ${{ needs.package.outputs.vsix }}
          # "Latest" stays with the web app's releases (the README's release badge follows it).
          make_latest: false

      - name: Next step
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VSIX: ${{ needs.package.outputs.vsix }}
          LISTED: ${{ steps.listed.outputs.listed }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          if [ "$LISTED" = "true" ]; then
            echo "### $VERSION is already on the Marketplace. Nothing left to do." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Upload $VSIX to the Marketplace"
              echo
              echo "1. Download \`$VSIX\` from [the release]($RELEASE_URL)."
              echo "2. Open <https://marketplace.visualstudio.com/manage/publishers/acltabontabon>."
              echo "3. On **Draft Canvas**, open **⋯ → Update** and upload the file."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
