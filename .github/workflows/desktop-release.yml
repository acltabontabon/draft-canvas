name: Desktop Release

# Builds Draft Canvas Desktop's installers and signed update packages into a GitHub release. Two
# callers, one version scheme:
#
#   release.yml, for every vX.Y.Z tag   A Draft Canvas release: web, Docker and desktop together, one
#                                       version (package.json's). release.yml creates the release; this
#                                       only adds the desktop files to it.
#   a desktop-vX.Y.Z-alpha.N tag        A desktop preview ahead of the release it leads to. This creates
#                                       its own prerelease, "Draft Canvas X.Y.Z-alpha.N"; its notes say it
#                                       is the desktop app's.
#   Run workflow, with a vX.Y.Z tag     Rebuilds an existing release's desktop files from its tagged
#                                       source — for a release whose desktop builds failed.
#
# The installers are signed for the operating system only when the repository has the secrets for
# it (see "Prepare OS signing" below and docs/reference/desktop-updates.md). Without them — the case
# today — they are ad-hoc signed on macOS and unsigned on Windows, the release notes say how to open
# them anyway, and checksums plus a build attestation let them be verified regardless.
on:
  push:
    tags:
      - 'desktop-v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag release.yml is running for.
        required: true
        type: string
      verified-commit:
        description: Commit already verified by the release orchestrator.
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      # OS signing, used only when present (see "Prepare OS signing").
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
  # Rebuilds the desktop files of a vX.Y.Z release that already exists — when its desktop builds
  # failed, say — from the tagged source, with this workflow as it is on the branch it runs from.
  # Every upload replaces what is there, so running it again is safe.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild the desktop files of, e.g. v1.12.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.version.outputs.preview }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.verified-commit || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: version
        run: |
          case "$TAG" in
            desktop-v*) echo "version=${TAG#desktop-v}" >> "$GITHUB_OUTPUT"; echo "preview=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"; echo "preview=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: The tag and the version agree
        run: node scripts/check-desktop-version.mjs --tag "$TAG"
      - name: The changelog has a dated section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -Fq "## [$VERSION] - 20" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [$VERSION] - YYYY-MM-DD' section."
            exit 1
          fi
      # Every release is also an update installed copies will be offered. That takes the update signing
      # key in the repository's secrets and its public half in tauri.conf.json; a release without them
      # isn't a smaller release, it's one nobody can update from. See docs/reference/desktop-updates.md.
      - name: The updater can ship
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo '::error::TAURI_SIGNING_PRIVATE_KEY is not set as a repository secret. See docs/reference/desktop-updates.md.'
            exit 1
          fi
          node scripts/update-manifest.mjs check-config

  acceptance:
    needs: verify
    uses: ./.github/workflows/desktop-ci.yml
    with:
      ref: ${{ needs.verify.outputs.commit }}

  # A preview's own draft release, for the matrix jobs to upload into so they can't race to create it.
  # A vX.Y.Z draft already exists: release.yml made it after web verification.
  draft:
    needs: [verify, acceptance]
    if: needs.verify.outputs.preview == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          gh release create "$TAG" \
            --draft --prerelease --verify-tag \
            --title "Draft Canvas $VERSION" \
            --notes-file notes.md

  build:
    name: build (${{ matrix.name }})
    needs: [verify, acceptance, draft]
    # The draft is skipped for a release (release.yml made it); a failed draft still stops the build.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.acceptance.result == 'success' && needs.draft.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # `update` is what the in-app updater downloads, signed beside it: the app bundle as .app.tar.gz
        # on macOS (the updater replaces the bundle; it can't use a disk image), and on Windows the
        # installer itself, run passively.
        include:
          - name: macOS arm64
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            target: aarch64-apple-darwin
            installer: Draft-Canvas_VERSION_macOS_arm64.dmg
            extension: .dmg
            update: Draft-Canvas_VERSION_macOS_arm64.app.tar.gz
            update-extension: .app.tar.gz
          # Built on the same arm64 runner as the entry above rather than on a native Intel one:
          # `macos-13` is the last Intel image GitHub offers and is on its way out, while
          # arm64 -> x86_64 is an ordinary Rust cross-compile that the Apple SDK on the runner
          # already supports. The bundler runs on the host and cares only about the target triple.
          - name: macOS x64
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            target: x86_64-apple-darwin
            installer: Draft-Canvas_VERSION_macOS_x64.dmg
            extension: .dmg
            update: Draft-Canvas_VERSION_macOS_x64.app.tar.gz
            update-extension: .app.tar.gz
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis
            target: ''
            installer: Draft-Canvas_VERSION_Windows_x64.exe
            extension: .exe
            update: Draft-Canvas_VERSION_Windows_x64.exe
            update-extension: -setup.exe
    steps:
      # Build jobs can stage artifacts but cannot replace public release assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The app is built as the version being released: package.json's for a release, the tag's for a
      # prerelease that leads it (check-desktop-version.mjs allows only that).
      - name: Build as this version
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node -e 'require("fs").writeFileSync("src-tauri/tauri.version.conf.json", JSON.stringify({ version: process.env.VERSION }))'
          cat src-tauri/tauri.version.conf.json
      # OS signing, only when the secrets for it exist. macOS: a Developer ID Application certificate
      # (APPLE_CERTIFICATE, base64 .p12; APPLE_CERTIFICATE_PASSWORD; APPLE_SIGNING_IDENTITY) and, for
      # notarization, APPLE_ID, APPLE_PASSWORD (an app-specific password) and APPLE_TEAM_ID — all read by
      # tauri-action itself. Windows: a code-signing certificate (WINDOWS_CERTIFICATE, base64 .pfx;
      # WINDOWS_CERTIFICATE_PASSWORD), imported here and named to the bundler by thumbprint. Without the
      # secrets this writes an empty config and the build is exactly what it was: ad-hoc on macOS,
      # unsigned on Windows. Nothing here ever weakens a signature check.
      - name: Prepare OS signing
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          config='{}'
          if [[ "$RUNNER_OS" == "macOS" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            config="$(node -e 'console.log(JSON.stringify({ bundle: { macOS: { signingIdentity: process.env.APPLE_SIGNING_IDENTITY } } }))')"
            # Handed to the build only when they hold something: the bundler imports a certificate
            # whenever APPLE_CERTIFICATE is *set*, and an empty one failed the 1.12.0 macOS builds with
            # "failed to import keychain certificate" although nothing was meant to be signed.
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -n "${!name}" ]]; then
                { echo "$name<<__DRAFT_CANVAS_SIGNING__"; printf '%s\n' "${!name}"; echo "__DRAFT_CANVAS_SIGNING__"; } >> "$GITHUB_ENV"
              fi
            done
            echo "::notice::macOS build will be signed as $APPLE_SIGNING_IDENTITY."
          elif [[ "$RUNNER_OS" == "Windows" && -n "$WINDOWS_CERTIFICATE" ]]; then
            echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.pfx"
            thumbprint="$(powershell -NoProfile -Command "(Import-PfxCertificate -FilePath '$RUNNER_TEMP\\signing.pfx' -CertStoreLocation Cert:\\CurrentUser\\My -Password (ConvertTo-SecureString -String '$WINDOWS_CERTIFICATE_PASSWORD' -AsPlainText -Force)).Thumbprint")"
            rm -f "$RUNNER_TEMP/signing.pfx"
            config="$(THUMB="$thumbprint" node -e 'console.log(JSON.stringify({ bundle: { windows: { certificateThumbprint: process.env.THUMB, digestAlgorithm: "sha256", timestampUrl: "http://timestamp.digicert.com" } } }))')"
            echo "::notice::Windows build will be signed with certificate $thumbprint."
          else
            echo "::notice::No OS signing secrets for $RUNNER_OS; the installer is built as before (ad-hoc on macOS, unsigned on Windows)."
          fi
          printf '%s\n' "$config" > src-tauri/tauri.signing.conf.json
          cat src-tauri/tauri.signing.conf.json
      # TAURI_SIGNING_* signs the update packages for the in-app updater (Tauri's own minisign signing),
      # a separate thing from OS signing above. The signature records the version, which the app
      # insists on, so a package can't be paired with another version's manifest. The APPLE_* values
      # the bundler reads to import the certificate and notarize come from "Prepare OS signing", and
      # only when they exist — never set here, where an unset secret would still arrive, empty.
      - name: Build the installer and the signed update package
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.sidecar.conf.json --config src-tauri/tauri.updater.conf.json --config src-tauri/tauri.version.conf.json --config src-tauri/tauri.signing.conf.json
      # The agent connector rides inside the app bundle (Settings → AI agents points agents at it): it
      # must be there, intact, and — where the runner can run it — built from this source (it reports
      # package.json's version, which a prerelease tag may lead).
      - name: The agent connector is in the app
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          app="$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)"
          sidecar="$app/Contents/MacOS/draft-canvas-mcp"
          test -x "$sidecar" || { echo "::error::$sidecar is missing."; exit 1; }
          codesign --verify --strict --verbose=2 "$sidecar"
          if [[ "$TARGET" == "aarch64-apple-darwin" ]]; then
            [[ "$("$sidecar" --version)" == "draft-canvas-mcp $VERSION" ]] || { echo "::error::The connector is not version $VERSION."; exit 1; }
          fi
      - name: The packaged macOS app starts
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          DRAFT_CANVAS_SMOKE: '1'
        run: |
          app="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)"
          output="$("$app/Contents/MacOS/draft-canvas")"
          echo "$output" | grep -q DRAFT_CANVAS_SMOKE_OK
      - name: The Windows installer installs and the installed app starts
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DRAFT_CANVAS_SMOKE: '1'
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $paths = ConvertFrom-Json $env:ARTIFACTS
          $installer = @($paths | Where-Object { $_ -like '*-setup.exe' })[0]
          if (-not $installer) { throw 'No NSIS installer was built.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'draft-canvas-smoke'
          $installed = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          # A release executable has the GUI subsystem, so capture inherited handles explicitly.
          $stdout = Join-Path $env:RUNNER_TEMP 'draft-canvas-smoke.stdout'
          $stderr = Join-Path $env:RUNNER_TEMP 'draft-canvas-smoke.stderr'
          $smoke = Start-Process -FilePath (Join-Path $installDir 'draft-canvas.exe') -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = Get-Content -Raw $stdout
          if ($smoke.ExitCode -ne 0 -or $output -notmatch 'DRAFT_CANVAS_SMOKE_OK') { throw 'Installed app failed its startup check.' }
      # tauri-action names files after the product ("Draft Canvas_1.9.4_x64-setup.exe"); the release
      # gets names a person can read and a script can predict.
      - name: Name the installer and the update package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          INSTALLER: ${{ matrix.installer }}
          EXTENSION: ${{ matrix.extension }}
          UPDATE: ${{ matrix.update }}
          UPDATE_EXTENSION: ${{ matrix.update-extension }}
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node -e '
            const { copyFileSync, existsSync, mkdirSync } = require("node:fs");
            const { VERSION, INSTALLER, EXTENSION, UPDATE, UPDATE_EXTENSION, ARTIFACTS } = process.env;
            const built = JSON.parse(ARTIFACTS);
            const find = (suffix, what) => {
              const found = built.find((file) => file.endsWith(suffix));
              if (!found) { console.error("::error::No " + what + " was built (" + suffix + ")."); process.exit(1); }
              return found;
            };
            mkdirSync("installers", { recursive: true });
            copyFileSync(find(EXTENSION, "installer"), "installers/" + INSTALLER.replace("VERSION", VERSION));
            const update = find(UPDATE_EXTENSION, "update package");
            if (!existsSync(update + ".sig")) { console.error("::error::" + update + " was not signed for updates."); process.exit(1); }
            copyFileSync(update, "installers/" + UPDATE.replace("VERSION", VERSION));
            copyFileSync(update + ".sig", "installers/" + UPDATE.replace("VERSION", VERSION) + ".sig");
          '
          node scripts/check-desktop-version.mjs --tag "$TAG" --artifacts installers
      # Checked on the machine that made it, against the public key compiled into the app: the earliest
      # point the wrong key, a missing signature or an unbound version can be caught.
      - name: Check the update signature
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          UPDATE: ${{ matrix.update }}
        run: node scripts/update-manifest.mjs check-artifact "installers/${UPDATE/VERSION/$VERSION}" "$VERSION"
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-package-${{ github.run_id }}-${{ matrix.name }}
          path: installers/*
          if-no-files-found: error
          retention-days: 7

  # Checksums, the update manifest and a build attestation. A preview then goes out as a prerelease,
  # never "Latest"; a stable release leaves draft only after every package passed.
  publish:
    needs: [verify, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-package-${{ github.run_id }}-*
          path: assets
          merge-multiple: true
      - name: Checksum the staged packages
        run: |
          # What people download; the .sig files are for the updater, which checks them itself.
          (cd assets && find . -maxdepth 1 -name 'Draft-Canvas_*' ! -name '*.sig' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && cat SHA256SUMS.txt)
      # Built from the signatures the builds made, then checked against the packages themselves: every
      # platform, every address the one this release will have, every signature made with the key in
      # the app, for this version, and valid for the exact bytes being published. Nothing goes public
      # until it passes.
      - name: Build and check the update manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/update-manifest.mjs build "$VERSION" assets --tag "$TAG" > assets/latest.json
          node scripts/update-manifest.mjs verify assets/latest.json "$VERSION" --tag "$TAG" --artifacts assets
          cat assets/latest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: assets/Draft-Canvas_*
      - env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ needs.verify.outputs.preview }}
        run: |
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$PREVIEW" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            # A stable release stays a draft until all installers and update signatures passed.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

  # Only now, with the release public and every file on it, are installed copies told about it.
  channels:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-update-pointer.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
