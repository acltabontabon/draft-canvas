name: Desktop update channels

# Decides which release installed copies of Draft Canvas Desktop are offered.
#
# Installed copies don't look at the releases page. They read one small file for their channel from a
# rolling release that holds nothing else:
#
#   https://github.com/acltabontabon/draft-canvas/releases/download/desktop-updates/stable.json
#   https://github.com/acltabontabon/draft-canvas/releases/download/desktop-updates/alpha.json
#
#   stable.json  the newest stable release. Stable installs read this.
#   alpha.json   the newest release of any kind. Prerelease installs read this, so an alpha moves on to
#                newer alphas and then to the release they led up to.
#
# (GitHub's own "latest" release is the web app's, so it can't be the desktop's.)
#
# In this order, stopping at the first thing that's wrong:
#
#   1. download the release's own manifest and every package it names, from the public addresses
#      installed copies will use;
#   2. check every signature against that exact download and the key compiled into the app;
#   3. only then move the channels — and only forward, unless forced.
#
# Two callers: desktop-release.yml, straight after a release is published, and the Actions tab — to run
# step 3 again after a failure, or with `force`, to point back at an older release when a newer one was
# bad. (That stops more people getting the bad one; it doesn't downgrade anyone already on it.)

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, such as v1.10.0 or desktop-v1.10.0-alpha.2.
        required: true
        type: string
      force:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, such as v1.10.0 or desktop-v1.10.0-alpha.2.
        required: true
        type: string
      force:
        description: Move the channels even to an older release (withdrawing a bad one).
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Two runs moving the same channels at once could leave them in either order.
  group: desktop-update-channels
  cancel-in-progress: false

env:
  CHANNELS_TAG: desktop-updates

jobs:
  point:
    name: Move the channels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The scripts and the public key of the release being pointed at, not of whatever main is now.
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      - name: The release is published
        id: release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in
            desktop-v[0-9]*.[0-9]*.[0-9]*-*) version="${TAG#desktop-v}" ;;
            v[0-9]*.[0-9]*.[0-9]*) version="${TAG#v}" ;;
            *) echo "::error::$TAG is neither a release (vX.Y.Z) nor a desktop preview (desktop-vX.Y.Z-alpha.N)."; exit 1 ;;
          esac
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$draft" = false ] || { echo "::error::$TAG is not published."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch what installed copies will fetch, and check it
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p fetched
          curl -fsSL --retry 5 --retry-delay 3 -o fetched/latest.json \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latest.json"
          node -e '
            const m = JSON.parse(require("fs").readFileSync("fetched/latest.json", "utf8"));
            for (const p of Object.values(m.platforms)) console.log(p.url);
          ' | while read -r url; do
            echo "  $url"
            curl -fsSL --retry 5 --retry-delay 3 -o "fetched/$(basename "$url")" "$url"
          done
          node scripts/update-manifest.mjs verify fetched/latest.json "$VERSION" --tag "$TAG" --artifacts fetched

      - name: Decide which channels move
        id: decide
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p existing out
          # No channels release yet, or no file in it, is nothing to beat.
          gh release download "$CHANNELS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern stable.json --pattern alpha.json --dir existing 2>/dev/null || true
          args=()
          [ "$FORCE" = true ] && args+=(--force)
          node scripts/update-manifest.mjs channels "$VERSION" --existing existing ${args[@]+"${args[@]}"} > out/moving.txt
          while read -r name; do
            [ -n "$name" ] && cp fetched/latest.json "out/$name"
          done < out/moving.txt
          if [ -s out/moving.txt ]; then
            echo 'Moving:'; sed 's/^/  /' out/moving.txt
          else
            echo 'Nothing to move: every channel already offers this release or a newer one.'
          fi
          echo "any=$([ -s out/moving.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # One rolling release holding only the channels: a prerelease, never "Latest", so it can't be taken
      # for something to download.
      - name: Make sure the channels release exists
        if: steps.decide.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$CHANNELS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$CHANNELS_TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'Draft Canvas Desktop updates' \
              --notes 'Not a download. Installed copies of Draft Canvas Desktop read stable.json or alpha.json from here to learn whether a newer version exists. To install Draft Canvas, use the other releases.' \
              --prerelease --latest=false
          fi

      - name: Move the channels
        if: steps.decide.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=()
          while read -r name; do [ -n "$name" ] && files+=("out/$name"); done < out/moving.txt
          gh release upload "$CHANNELS_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

      # Read back through the address installed copies use. GitHub's edge can lag a moment.
      - name: Read them back
        if: steps.decide.outputs.any == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          while read -r name; do
            [ -n "$name" ] || continue
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$CHANNELS_TAG/$name"
            ok=false
            for _ in 1 2 3 4 5 6; do
              got=$(curl -fsSL "$url" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).version)' 2>/dev/null || true)
              if [ "$got" = "$VERSION" ]; then ok=true; break; fi
              sleep 10
            done
            "$ok" || { echo "::error::$url says '${got:-nothing}', expected $VERSION."; exit 1; }
            echo "  $name -> $VERSION"
          done < out/moving.txt
