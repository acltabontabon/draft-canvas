name: Dependency security

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # Audit historical sources with the current reviewed policy/tooling too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .automation
          sparse-checkout: |
            scripts
            .github/advisory-exceptions.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: npm ci
      - run: npm ci
        working-directory: www
      - run: npx --no-install tsx .automation/scripts/dependency-audit.ts npm --policy .automation/.github/advisory-exceptions.json
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: npx --no-install tsx .automation/scripts/dependency-audit.ts cargo --policy .automation/.github/advisory-exceptions.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dependency-audit-${{ github.run_id }}
          path: audit-results/
          if-no-files-found: warn
          retention-days: 14
