name: Bug report
description: Something in Draft Canvas isn't working right.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: As specific as you can — what you clicked, dragged, or typed, in order.
      placeholder: |
        1. Add a Service node
        2. Connect it to a Database
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: clean-canvas
    attributes:
      label: Does this reproduce on a fresh, empty canvas?
      description: Helps narrow down whether it's specific to your diagram/data or a general bug.
      options:
        - "Yes"
        - "No"
        - "Haven't tried"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: e.g. Chrome 141, Safari 18, Firefox 133
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Draft Canvas version or commit
      description: Shown in the About dialog, or the commit you're running if built from source.
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: If it's a visual or interaction bug, this is usually the fastest way to show it.
    validations:
      required: false
